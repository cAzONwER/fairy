<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>宣银论坛 - 宣银大学</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23101828'/%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%23c8d3e8' stroke-width='2'/%3E%3Ctext x='32' y='42' font-size='26' text-anchor='middle' fill='%23c8d3e8' font-family='serif'%3E宣%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink: #0d1420;
    --ink-2: #101a2c;
    --line: rgba(160, 180, 220, .16);
    --text: #dbe4f3;
    --text-dim: #8fa0bd;
    --text-faint: #5c6c8a;
    --accent: #c8d3e8;
    --accent-dim: #9fb0cc;
    --error: #e08a8a;
    --ok: #9ecf9e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    background:
      radial-gradient(ellipse 90% 55% at 50% -8%, rgba(90, 115, 165, .22), transparent 60%),
      linear-gradient(180deg, var(--ink-2), var(--ink) 55%);
    color: var(--text);
    min-width: 1080px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: auto;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 56px 56px;
    opacity: .35;
    pointer-events: none;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 100%);
  }

  header {
    position: relative;
    z-index: 2;
    border-bottom: 1px solid var(--line);
    background: rgba(13, 20, 32, .75);
    backdrop-filter: blur(6px);
  }

  .header-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .site-mark {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--text);
  }

  .site-mark svg { width: 40px; height: 40px; }

  .site-name {
    font-family: "SimSun", "Songti SC", serif;
    font-size: 20px;
    letter-spacing: 2px;
  }

  .site-sub {
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 3px;
    margin-top: 2px;
  }

  nav {
    margin-left: auto;
    display: flex;
    gap: 30px;
  }

  nav a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
    transition: color .2s;
  }

  nav a:hover { color: var(--text); }

  .notice-bar {
    position: relative;
    z-index: 2;
    max-width: 1080px;
    width: 100%;
    margin: 32px auto 0;
    padding: 0 24px;
  }

  .notice {
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent-dim);
    background: rgba(200, 211, 232, .05);
    padding: 11px 16px;
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .notice .tag {
    color: var(--accent);
    font-size: 12px;
    border: 1px solid var(--line);
    padding: 1px 8px;
    border-radius: 3px;
    white-space: nowrap;
  }

  main {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px 24px 72px;
  }

  .login-card {
    width: 420px;
    border: 1px solid var(--line);
    background: rgba(16, 26, 44, .82);
    backdrop-filter: blur(8px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    padding: 44px 40px 32px;
  }

  .emblem-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 32px;
  }

  .emblem-row svg { width: 76px; height: 76px; }

  .forum-title {
    font-family: "SimSun", "Songti SC", serif;
    font-size: 26px;
    letter-spacing: 8px;
    text-indent: 8px;
    color: var(--accent);
  }

  .forum-title-en {
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--text-faint);
    text-transform: uppercase;
  }

  .field { position: relative; margin-bottom: 18px; }

  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-bottom: 7px;
  }

  /* 点击输入框时弹出的提示气泡 */
  .hint-bubble {
    position: absolute;
    left: 8px;
    bottom: calc(100% - 10px);
    background: #1a2740;
    border: 1px solid rgba(200, 211, 232, .35);
    color: var(--text);
    font-size: 12.5px;
    letter-spacing: 1px;
    padding: 8px 14px;
    border-radius: 4px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
    white-space: nowrap;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 10;
  }

  .hint-bubble::after {
    content: "";
    position: absolute;
    left: 26px;
    bottom: -5px;
    width: 8px;
    height: 8px;
    background: #1a2740;
    border-right: 1px solid rgba(200, 211, 232, .35);
    border-bottom: 1px solid rgba(200, 211, 232, .35);
    transform: rotate(45deg);
  }

  .hint-bubble.show { opacity: 1; transform: translateY(0); }

  .field input {
    width: 100%;
    height: 42px;
    background: rgba(13, 20, 32, .8);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 0 14px;
    font-size: 14px;
    letter-spacing: 1px;
    outline: none;
    transition: border-color .2s, background .2s;
  }

  .field input::placeholder { color: var(--text-faint); letter-spacing: 1px; }

  .field input:focus {
    border-color: var(--accent-dim);
    background: rgba(20, 30, 50, .9);
  }

  .field-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    margin-bottom: 22px;
    color: var(--text-faint);
  }

  .field-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }

  .field-row input[type="checkbox"] {
    appearance: none;
    width: 13px;
    height: 13px;
    border: 1px solid var(--text-faint);
    background: transparent;
    cursor: pointer;
    position: relative;
  }

  .field-row input[type="checkbox"]:checked {
    background: var(--accent-dim);
    border-color: var(--accent-dim);
  }

  .field-row input[type="checkbox"]:checked::after {
    content: "✓";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: var(--ink);
  }

  .field-row a { color: var(--text-faint); text-decoration: none; }
  .field-row a:hover { color: var(--text-dim); }

  .btn-login {
    width: 100%;
    height: 44px;
    background: var(--accent);
    border: none;
    color: #101a2c;
    font-size: 15px;
    letter-spacing: 8px;
    text-indent: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, transform .1s;
    font-family: inherit;
  }

  .btn-login:hover { background: #e2eaf8; }
  .btn-login:active { transform: translateY(1px); }
  .btn-login:disabled { background: var(--text-faint); cursor: wait; }

  .msg {
    min-height: 20px;
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--error);
    text-align: center;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity .25s;
  }

  .msg.show { opacity: 1; }
  .msg.ok { color: var(--ok); }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0 14px;
    color: var(--text-faint);
    font-size: 11px;
    letter-spacing: 2px;
  }

  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .links {
    display: flex;
    justify-content: center;
    gap: 28px;
    font-size: 12.5px;
  }

  .links a {
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 1px;
  }

  .links a:hover { color: var(--text); }

  footer {
    position: relative;
    z-index: 2;
    border-top: 1px solid var(--line);
    padding: 18px 24px 22px;
    text-align: center;
    font-size: 11.5px;
    color: var(--text-faint);
    letter-spacing: 1px;
    line-height: 2;
  }

  footer .sep { margin: 0 10px; opacity: .4; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="site-mark" href="#">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="none" stroke="#c8d3e8" stroke-width="1.5" opacity=".8"/>
        <circle cx="32" cy="32" r="25.5" fill="none" stroke="#c8d3e8" stroke-width=".75" opacity=".5"/>
        <text x="32" y="41" font-size="24" text-anchor="middle" fill="#c8d3e8" font-family="SimSun, serif">宣</text>
      </svg>
      <span>
        <div class="site-name">宣银大学</div>
        <div class="site-sub">XUANYIN UNIVERSITY</div>
      </span>
    </a>
    <nav>
      <a href="#">校园门户</a>
      <a href="#">图书馆</a>
      <a href="#">教务系统</a>
      <a href="#">校园邮箱</a>
    </nav>
  </div>
</header>

<div class="notice-bar">
  <div class="notice">
    <span class="tag">公告</span>
    <span>论坛系统正在例行维护，部分历史板块暂时关闭，恢复时间另行通知。</span>
  </div>
</div>

<main>
  <form class="login-card" id="loginForm" novalidate>
    <div class="emblem-row">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="31" fill="none" stroke="#c8d3e8" stroke-width="1"/>
        <circle cx="32" cy="32" r="26" fill="none" stroke="#c8d3e8" stroke-width=".6" opacity=".55"/>
        <path d="M32 24 C27 20, 20 20, 17 22 L17 40 C20 38, 27 38, 32 42 C37 38, 44 38, 47 40 L47 22 C44 20, 37 20, 32 24 Z"
              fill="none" stroke="#c8d3e8" stroke-width="1.4"/>
        <line x1="32" y1="24" x2="32" y2="42" stroke="#c8d3e8" stroke-width="1.4"/>
        <path d="M20 48 Q26 45.5, 32 48 T44 48" fill="none" stroke="#c8d3e8" stroke-width="1" opacity=".7"/>
        <path d="M23 52 Q28 49.8, 33 52 T43 52" fill="none" stroke="#c8d3e8" stroke-width=".8" opacity=".45"/>
      </svg>
      <div style="text-align:center">
        <div class="forum-title">宣银论坛</div>
        <div class="forum-title-en">XUANYIN BBS · Est. 1997</div>
      </div>
    </div>

    <div class="field">
      <div class="hint-bubble" id="hintUser">我的学号是32511016202</div>
      <label for="username">学号 / 工号 / 昵称</label>
      <input type="text" id="username" name="username" autocomplete="off" placeholder="请输入账号" spellcheck="false">
    </div>

    <div class="field">
      <div class="hint-bubble" id="hintPass">我的密码一般是zhoushui1108</div>
      <label for="password">密码</label>
      <input type="password" id="password" name="password" autocomplete="off" placeholder="请输入密码">
    </div>

    <div class="field-row">
      <label><input type="checkbox" id="remember"> 记住我</label>
      <a href="#" id="forgotLink">忘记密码？</a>
    </div>

    <button class="btn-login" type="submit" id="loginBtn">登 录</button>

    <div class="msg" id="msg"></div>

    <div class="divider">VISITOR ACCESS</div>

    <div class="links">
      <a href="#" id="registerLink">注册账号</a>
      <a href="#" id="guestLink">游客浏览</a>
    </div>
  </form>
</main>

<footer>
  <div>
    宣银大学网络中心<span class="sep">|</span>宣银论坛管理组
  </div>
  <div>
    建议使用 1024×768 以上分辨率浏览<span class="sep">|</span>自 1997 年以来的第 4,096,532 位访客
  </div>
</footer>

<script>
  const CORRECT_USER = '32511016202';
  const CORRECT_PASS = 'zhoushui1108';

  const form = document.getElementById('loginForm');
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');
  const userInput = document.getElementById('username');
  const passInput = document.getElementById('password');

  function showMsg(text, ok) {
    msg.textContent = text;
    msg.classList.toggle('ok', !!ok);
    msg.classList.add('show');
  }

  userInput.addEventListener('focus', () => document.getElementById('hintUser').classList.add('show'));
  userInput.addEventListener('blur',  () => document.getElementById('hintUser').classList.remove('show'));
  passInput.addEventListener('focus', () => document.getElementById('hintPass').classList.add('show'));
  passInput.addEventListener('blur',  () => document.getElementById('hintPass').classList.remove('show'));

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    msg.classList.remove('show');

    const username = userInput.value.trim();
    const password = passInput.value.trim();

    if (!username) { showMsg('请输入账号'); return; }
    if (!password) { showMsg('请输入密码'); return; }

    btn.disabled = true;
    btn.textContent = '验证中';

    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = '登 录';

      if (username === CORRECT_USER && password === CORRECT_PASS) {
        showMsg('登录成功，正在进入论坛...', true);
        setTimeout(() => { location.href = 'forum.html'; }, 600);
      } else {
        showMsg('用户名或密码错误，连续失败 5 次将锁定 15 分钟');
        passInput.value = '';
      }
    }, 900);
  });

  document.getElementById('forgotLink').addEventListener('click', (e) => {
    e.preventDefault();
    showMsg('请联系辅导员或网络中心（行政楼 305 室）重置密码');
  });

  document.getElementById('registerLink').addEventListener('click', (e) => {
    e.preventDefault();
    showMsg('本学期新用户注册已暂停');
  });

  document.getElementById('guestLink').addEventListener('click', (e) => {
    e.preventDefault();
    showMsg('游客通道维护中');
  });
</script>

</body>
</html>
