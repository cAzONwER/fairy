<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>防忘 · 仙女村</title>
<style>
  :root {
    --ink: #3E2723;
    --ink-faint: #8D6E63;
    --paper: #F5EDE0;
    --paper-light: #FAF3E4;
    --line: #D4C5A9;
    --accent: #A5432F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  .page { max-width: 720px; margin: 0 auto; padding: 40px 24px 80px; }
  .back {
    display: inline-block;
    margin-bottom: 20px;
    color: var(--ink-faint);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 1px;
  }
  .back:hover { color: var(--accent); }
  h1 {
    font-size: 28px;
    letter-spacing: 6px;
    text-align: center;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
  }
  .content {
    font-size: 18px;
    line-height: 2.2;
    text-align: center;
    letter-spacing: 4px;
  }
  footer {
    text-align: center;
    padding: 40px 0 0;
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: 3px;
  }
</style>
</head>
<body>
<div class="page">
  <a class="back" href="javascript:history.back()">← 返回上一页</a>
  <h1>防忘</h1>
  <div class="content">89771</div>
  <footer>仙女村 · 欢迎您来</footer>
</div>
</body>
</html>
