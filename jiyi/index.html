<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>jiyi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='42' font-size='24' text-anchor='middle' fill='%23333' font-family='monospace'%3E%3F%3C/text%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body {
    font-family: "Courier New", Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
  }

  .gate-label {
    color: #fff;
    font-size: 15px;
    letter-spacing: 6px;
    text-indent: 6px;
    user-select: none;
  }

  .gate-input {
    width: 260px;
    background: transparent;
    border: none;
    border-bottom: 1px solid #222;
    color: #555;
    font-family: inherit;
    font-size: 17px;
    letter-spacing: 8px;
    text-align: center;
    padding: 8px 0;
    outline: none;
    caret-color: #777;
    transition: border-color .3s;
  }

  .gate-input:focus { border-bottom-color: #444; }

  .gate-input.wrong {
    animation: shake .4s;
    border-bottom-color: #3a1515;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-5px); }
  }

  /* 输入为空时的微弱提示光标 */
  .gate-input::placeholder {
    color: #141414;
    letter-spacing: 2px;
  }

  /* 输入框下方浮动提示语 */
  .gate-hint {
    color: #fff;
    font-size: 13px;
    letter-spacing: 6px;
    text-indent: 6px;
    user-select: none;
    animation: hintFloat 3.2s ease-in-out infinite, hintBreath 3.2s ease-in-out infinite;
  }

  @keyframes hintFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  @keyframes hintBreath {
    0%, 100% { opacity: .35; }
    50% { opacity: .8; }
  }
</style>
</head>
<body>

<div class="gate">
  <div class="gate-label">password</div>
  <input class="gate-input" id="pwd" type="text" autocomplete="off" spellcheck="false">
  <div class="gate-hint">看着他的脸</div>
</div>

<div id="seq" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;">
  <div class="seq-text" style="color:#888;font-size:22px;letter-spacing:6px;opacity:0;transition:opacity .5s;"></div>
</div>

<script>
  // 口令配置（不区分大小写）
  var CORRECT_PASS = 'wtxtr';

  var input = document.getElementById('pwd');

  input.focus();

  input.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    var val = input.value.trim().toLowerCase();
    if (!val) return;

    if (val === CORRECT_PASS) {
      // 口令正确 → 文字序列 → 进入 main
      document.querySelector('.gate').style.display = 'none';
      var seq = document.getElementById('seq');
      seq.style.display = 'flex';

      var lines = ['壬申年五月廿三丑时', '董荣', '山中', '寻找手绢'];
      var delays = [500, 1000, 500, 500, 1000, 500, 500, 1000, 500, 500, 1000, 1500];
      var idx = 0;

      function step() {
        if (idx >= lines.length) {
          setTimeout(function() { window.location.href = 'main.html'; }, 200);
          return;
        }
        var el = seq.querySelector('.seq-text');
        el.textContent = lines[idx];
        el.style.transition = 'opacity .5s';
        el.style.opacity = '1';

        setTimeout(function() {
          var outTime = (idx === lines.length - 1) ? 1500 : 500;
          el.style.transition = 'opacity ' + outTime + 'ms';
          el.style.opacity = '0';
          setTimeout(function() {
            idx++;
            step();
          }, outTime);
        }, 2000);
      }

      setTimeout(step, 300);
    } else {
      // 口令错误 → 抖动 + 清空
      input.classList.remove('wrong');
      void input.offsetWidth;
      input.classList.add('wrong');
      input.value = '';
    }
  });

  // 点击页面任意处聚焦输入框
  document.body.addEventListener('click', function() {
    input.focus();
  });
</script>

</body>
</html>
