<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>宣银邮箱 · 登录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='16' width='52' height='32' rx='3' fill='none' stroke='%237a6a58' stroke-width='2'/%3E%3Cpolyline points='6,18 32,36 58,18' fill='none' stroke='%237a6a58' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #FFF7D1;
    --bg-deep: #F5EDB8;
    --ink: #5A4E3A;
    --ink-dim: #8C7E68;
    --ink-faint: #B5A98F;
    --accent: #C07F3C;
    --accent-dim: #D49A5B;
    --line: #E8DFA8;
    --card: #FFFBE6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-width: 1080px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: auto;
  }

  /* ===== 顶部 ===== */
  header {
    width: 100%;
    max-width: 1080px;
    padding: 28px 48px 0;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-logo {
    width: 44px;
    height: 44px;
    border: 2px solid var(--ink-dim);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--ink-dim);
    letter-spacing: 0;
  }

  .brand-text .brand-name {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--ink);
  }

  .brand-text .brand-sub {
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 3px;
    margin-top: 2px;
  }

  .brand-link {
    margin-left: auto;
    font-size: 12px;
    color: var(--ink-dim);
    text-decoration: none;
    letter-spacing: 1px;
  }

  .brand-link:hover { color: var(--accent); }

  /* ===== 登录区 ===== */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 0;
    width: 100%;
  }

  .login-card {
    width: 440px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 48px 44px;
    box-shadow: 0 8px 32px rgba(120, 100, 50, .08);
  }

  .login-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 3px;
    text-align: center;
    margin-bottom: 6px;
  }

  .login-sub {
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
    letter-spacing: 2px;
    margin-bottom: 36px;
  }

  .form-group {
    margin-bottom: 22px;
  }

  .form-label {
    display: block;
    font-size: 13px;
    color: var(--ink-dim);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .form-input {
    width: 100%;
    height: 42px;
    padding: 0 14px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s, background .15s;
  }

  .form-input::placeholder { color: var(--ink-faint); }
  .form-input:focus {
    border-color: var(--accent-dim);
    background: #FFF;
  }

  .form-input.error {
    border-color: #C05040;
  }

  .form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
  }

  .remember {
    font-size: 12px;
    color: var(--ink-dim);
    cursor: pointer;
    letter-spacing: 1px;
  }

  .remember input {
    margin-right: 6px;
  }

  .forgot {
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    letter-spacing: 1px;
  }

  .forgot:hover { text-decoration: underline; }

  .login-btn {
    width: 100%;
    height: 44px;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: #FFF;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 4px;
    cursor: pointer;
    transition: background .15s;
  }

  .login-btn:hover { background: var(--accent-dim); }

  .login-btn:disabled {
    background: var(--ink-faint);
    cursor: not-allowed;
  }

  .login-footer {
    text-align: center;
    margin-top: 28px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
  }

  .login-footer a {
    font-size: 12px;
    color: var(--ink-dim);
    text-decoration: none;
    letter-spacing: 1px;
    margin: 0 12px;
  }

  .login-footer a:hover { color: var(--accent); }

  footer {
    padding: 20px 0 28px;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 2px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div class="brand-logo">邮</div>
  <div class="brand-text">
    <div class="brand-name">宣银邮箱</div>
    <div class="brand-sub">XUANYIN · UNIVERSITY · MAIL</div>
  </div>
  <a class="brand-link" href="../xuanyin-bbs/index.html">返回宣银论坛 →</a>
</header>

<main>
  <div class="login-card">
    <div class="login-title">账户登录</div>
    <div class="login-sub">宣银大学校园邮箱系统</div>

    <form id="loginForm" onsubmit="return false;">
      <div class="form-group">
        <label class="form-label" for="mailUser">邮箱地址</label>
        <input class="form-input" id="mailUser" type="text" placeholder="请输入邮箱账号" autocomplete="off">
      </div>

      <div class="form-group">
        <label class="form-label" for="mailPass">密码</label>
        <input class="form-input" id="mailPass" type="password" placeholder="请输入密码">
      </div>

      <div class="form-options">
        <label class="remember"><input type="checkbox"> 记住账号</label>
        <a class="forgot" href="#">忘记密码？</a>
      </div>

      <button class="login-btn" id="loginBtn" type="submit">登 录</button>

      <div class="login-footer">
        <a href="#">申请邮箱</a>
        <a href="#">帮助中心</a>
        <a href="#">联系管理员</a>
      </div>
    </form>
  </div>
</main>

<footer>
  宣银大学信息化中心 · 版本 2.3.1 · 校园网专用
</footer>

<script>
  // 正确账密（邮箱登录用纯账号，无需 @xuanyin.edu.cn）
  var ACCOUNTS = {
    '20060921': 'zhoushui1108',  // 周水
    '19320626': '5399'           // 另一账号
  };

  function stripDomain(v) {
    return v.replace(/@xuanyin\.edu\.cn$/i, '').trim();
  }

  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('mailPass').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });

  function doLogin() {
    var u = stripDomain(document.getElementById('mailUser').value);
    var p = document.getElementById('mailPass').value;
    var userInput = document.getElementById('mailUser');
    var passInput = document.getElementById('mailPass');

    userInput.classList.remove('error');
    passInput.classList.remove('error');

    if (!u) { userInput.classList.add('error'); return; }
    if (!p) { passInput.classList.add('error'); return; }

    if (ACCOUNTS[u] && ACCOUNTS[u] === p) {
      // 登录成功 → 跳 mailbox
      var btn = document.getElementById('loginBtn');
      btn.textContent = '登录中...';
      btn.disabled = true;
      setTimeout(function() {
        window.location.href = 'mail.html?u=' + encodeURIComponent(u);
      }, 400);
    } else {
      userInput.classList.add('error');
      passInput.classList.add('error');
    }
  }
</script>

</body>
</html>
